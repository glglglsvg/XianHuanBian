name: Build Mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Download and install Gradle 8.7
        run: |
          wget -q https://mirrors.huaweicloud.com/gradle/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$(pwd)/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Verify Gradle
        run: gradle --version

      - name: Clean all caches (force)
        run: |
          rm -rf ~/.gradle/caches/fabric-loom
          rm -rf ~/.gradle/caches/modules-2
          rm -rf ~/.gradle/daemon
          rm -rf build .gradle

      - name: Build with Gradle
        env:
          GRADLE_OPTS: "-Xmx4096m -XX:MaxMetaspaceSize=512m"
        run: gradle build --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=512m" -Dorg.gradle.workers.max=2 --refresh-dependencies

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XianHuanBian
          path: build/libs/*.jar
