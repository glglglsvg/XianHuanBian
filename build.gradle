buildscript {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.aliyun.com/repository/gradle-plugin" }
        mavenCentral()
    }
    dependencies {
        classpath "fabric-loom:fabric-loom.gradle.plugin:1.9.2"
    }
}

apply plugin: "fabric-loom"
apply plugin: "maven-publish"

loom {
    mixin {
        defaultRefmapName = "xianhuanbian.refmap.json"
    }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
}

base.archivesName = 'XianHuanBian'
version = '1.0.0'
group = 'com.yourmod.xianhuanbian'

repositories {
    maven { url "https://mirrors.ustc.edu.cn/maven/repository/maven-public/" }
    maven { url "https://maven.fabricmc.net/" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:1.20.1"
    mappings "net.fabricmc:yarn:1.20.1+build.10:v2"
    modImplementation "net.fabricmc:fabric-loader:0.15.0"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.92.9+1.20.1"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}
