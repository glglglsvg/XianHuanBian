name: Build Mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Generate Gradle Wrapper with Gradle 8.11
        run: |
          # 确保 gradlew 指向 8.11 的 wrapper
          ./gradlew wrapper --gradle-version 8.11 --no-daemon
        continue-on-error: false

      - name: Clean caches
        run: |
          rm -rf ~/.gradle/caches
          rm -rf ~/.gradle/daemon
          rm -rf build .gradle

      - name: Build with Gradle Wrapper
        env:
          GRADLE_OPTS: "-Xmx4096m -XX:MaxMetaspaceSize=512m"
        run: ./gradlew build --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=512m" -Dorg.gradle.workers.max=2

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XianHuanBian
          path: build/libs/*.jar
