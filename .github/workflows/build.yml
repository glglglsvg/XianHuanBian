name: Build Mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Download and install Gradle 8.11
        run: |
          wget -q https://mirrors.huaweicloud.com/gradle/gradle-8.11-bin.zip
          unzip -q gradle-8.11-bin.zip
          echo "$(pwd)/gradle-8.11/bin" >> $GITHUB_PATH

      - name: Verify Gradle
        run: gradle --version

      - name: Generate Gradle Wrapper with Gradle 8.11
        run: gradle wrapper --gradle-version 8.11 --no-daemon

      - name: Clean caches
        run: |
          rm -rf ~/.gradle/caches
          rm -rf ~/.gradle/daemon
          rm -rf build .gradle

      - name: Build with Gradle Wrapper
        env:
          GRADLE_OPTS: "-Xmx4096m -XX:MaxMetaspaceSize=512m"
        run: ./gradlew build --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=512m" -Dorg.gradle.workers.max=2

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XianHuanBian
          path: build/libs/*.jar
